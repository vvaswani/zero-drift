[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "analytics-sdk"
version = "1.0.3"
description = "Python SDK for the Analytics API (version synced to API spec)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.24.0",
    "python-dateutil>=2.8.0",
]

[project.urls]
Repository = "https://github.com/vvaswani/zero-drift"
