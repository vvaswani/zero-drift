name: Update Docs on Spec Change

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  review-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Review spec and update docs if needed
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/docs_review_agent.py

      - name: Commit and open PR if docs changed
        if: always()
        env:
          TRIGGERING_COMMIT: ${{ github.event.after }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/how-to/

          if git diff --cached --quiet; then
            echo "No doc changes to commit"
          else
            BRANCH_NAME="docs-update-${GITHUB_SHA::8}"

            git checkout -b "$BRANCH_NAME"

            git commit -m "docs: update guides based on spec changes"

            git push origin "$BRANCH_NAME"

            printf "This PR contains documentation updates suggested by the docs review agent.\n\nTriggering commit: %s\n\nThe agent analyzed the OpenAPI spec changes and determined that the how-to guides needed updating to reflect the new API behavior.\n" \
              "$TRIGGERING_COMMIT" > /tmp/pr_body.txt

            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "docs: update guides based on spec changes" \
              --body-file /tmp/pr_body.txt
          fi
