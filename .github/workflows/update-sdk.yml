name: Update SDK on spec change

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install datamodel-code-generator pyyaml pydantic httpx python-dateutil build tomli

      - name: Generate SDK
        run: python sdk/python/scripts/generate_sdk.py

      - name: Install SDK for testing
        run: |
          cd sdk/python
          pip install -e .

      - name: Run SDK smoke tests
        run: |
          python -c "from analytics_sdk import AnalyticsClient; c = AnalyticsClient('test'); assert hasattr(c, 'analytics'); print('✓ SDK smoke tests passed')"

      - name: Commit and open PR if SDK changed
        if: always()
        env:
          TRIGGERING_COMMIT: ${{ github.event.after }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add sdk/python/analytics_sdk/ sdk/python/pyproject.toml

          if git diff --cached --quiet; then
            echo "No SDK changes to commit"
          else
            BRANCH_NAME="sdk-update-${GITHUB_SHA::8}"

            git checkout -b "$BRANCH_NAME"

            git commit -m "chore: regenerate SDK from OpenAPI specs"

            git push origin "$BRANCH_NAME"

            printf "This PR contains SDK updates regenerated from the Analytics API spec changes.\n\nTriggering commit: %s\n\nThe SDK codegen was run against the updated OpenAPI spec and generated new models and service methods.\n" \
              "$TRIGGERING_COMMIT" > /tmp/sdk_pr_body.txt

            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "chore: regenerate SDK from OpenAPI specs" \
              --body-file /tmp/sdk_pr_body.txt
          fi
